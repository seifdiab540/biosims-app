
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify expected files
        run: |
          test -f package.json || {
            echo "ERROR: package.json not found in repository root"
            exit 1
          }

          test -f package-lock.json || {
            echo "ERROR: package-lock.json not found in repository root"
            exit 1
          }

          test -f docs/index.html || {
            echo "ERROR: docs/index.html not found"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Build simulation app
        run: npm run build

      - name: Verify build output
        run: |
          test -f app/dist/index.html || {
            echo "ERROR: app/dist/index.html not found."
            echo "Check the build script and actual output directory."
            exit 1
          }

      - name: Assemble Pages site
        run: |
          set -eu

          rm -rf _site
          mkdir -p _site/reader

          cp -R app/dist/. _site/

          cp -R docs/. _site/reader/

          touch _site/.nojekyll

          echo "Published file layout:"
          find _site -maxdepth 3 -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
